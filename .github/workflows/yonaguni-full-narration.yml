name: Generate Yonaguni full narration
on:
  workflow_dispatch:
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free narration dependency
        run: python -m pip install 'edge-tts>=7,<9'
      - name: Generate all eight scenes
        run: python scripts/generate_yonaguni_narration.py
      - name: Upload narration MP3 files
        uses: actions/upload-artifact@v4
        with:
          name: yonaguni-full-narration
          path: output/yonaguni_narration/
          if-no-files-found: error
          retention-days: 7
