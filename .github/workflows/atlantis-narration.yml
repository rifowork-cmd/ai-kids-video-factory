name: Atlantis narration (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TTS client
        run: python -m pip install 'openai>=1.60,<3'
      - name: Generate narration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python atlantis/tts.py
      - name: Save narration
        uses: actions/upload-artifact@v4
        with:
          name: atlantis-narration
          path: output/narration.mp3
          retention-days: 7
