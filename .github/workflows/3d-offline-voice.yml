name: 3D bunny and offline bilingual voice prototypes
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/3d-offline-voice.yml'
      - 'src/blender_scene.py'
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Blender and offline voice tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg espeak-ng libegl1 libgl1 libopengl0 libgles2 libx11-6 libxext6 libxrender1 libxi6 libxfixes3 libxxf86vm1 libsm6 libice6 libxkbcommon0
      - name: Render silent 3D master
        run: |
          set -euo pipefail
          mkdir -p output
          LIBGL_ALWAYS_SOFTWARE=1 blender -b -t 2 --python-exit-code 1 --python src/blender_scene.py -- --output output/3d-master.mp4 2>&1 | tee output/blender.log
          echo "Rendered frames: $(find output/frames -name 'frame_*.png' | wc -l)"
          test "$(find output/frames -name 'frame_*.png' | wc -l)" -eq 180
          ffmpeg -hide_banner -loglevel error -y -framerate 12 -start_number 1 -i output/frames/frame_%04d.png -c:v libx264 -pix_fmt yuv420p -movflags +faststart output/3d-master.mp4
          test -s output/3d-master.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/3d-master.mp4
      - name: Generate offline bilingual voices
        run: |
          python src/narrate_offline.py --language ja --output output/ja.wav
          python src/narrate_offline.py --language en --output output/en.wav
      - name: Merge voice and 3D video
        run: |
          ffmpeg -hide_banner -loglevel error -y -i output/3d-master.mp4 -i output/ja.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -af apad -t 15 output/bunny-3d-ja.mp4
          ffmpeg -hide_banner -loglevel error -y -i output/3d-master.mp4 -i output/en.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -af apad -t 15 output/bunny-3d-en.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bunny-3d-offline-voice-prototypes
          path: |
            output/*.mp4
            output/*.wav
            output/*.log
          retention-days: 7
