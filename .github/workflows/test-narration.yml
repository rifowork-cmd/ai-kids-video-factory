name: Test AI narration
on:
  workflow_dispatch:
jobs:
  narration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OpenAI SDK
        run: python -m pip install 'openai>=1.0,<3'
      - name: Generate sample audio
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/test_narration.py
      - name: Save sample audio
        uses: actions/upload-artifact@v4
        with:
          name: narration-sample
          path: output/narration_sample.mp3
          retention-days: 3
